<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Commission</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  color:#222;
}

.header{
  background:linear-gradient(135deg,#ff9800,#ff5722);
  color:white;
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.container{
  padding:15px;
}

.total-box{
  background:white;
  border-radius:15px;
  padding:20px;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
  margin-bottom:15px;
}

.total-title{
  font-size:15px;
  color:#777;
}

.total-amount{
  font-size:30px;
  font-weight:bold;
  color:#ff5722;
  margin-top:8px;
}

.ref-box{
  background:white;
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.ref-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.ref-code{
  font-size:20px;
  font-weight:bold;
  color:#ff5722;
}

.count{
  font-weight:bold;
}

.user-card{
  background:white;
  border-radius:15px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.user-name{
  font-size:18px;
  font-weight:bold;
  margin-bottom:6px;
}

.user-mobile{
  color:#666;
  font-size:14px;
}

.user-ref{
  font-size:13px;
  color:#777;
  margin-top:5px;
}

.user-commission{
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid #eee;
  display:flex;
  justify-content:space-between;
  font-weight:bold;
}

.commission{
  color:#16a34a;
}

.history-item{
  margin-top:10px;
  padding:10px;
  background:#f7f7f7;
  border-radius:10px;
  font-size:13px;
}

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
  background:white;
  border-radius:15px;
}

.error{
  text-align:center;
  padding:20px;
  color:#d32f2f;
  background:#fff;
  border-radius:15px;
}

</style>

</head>

<body>

<div class="header">
  My Commission
</div>

<div class="container">

  <div class="total-box">

    <div class="total-title">
      Total Commission
    </div>

    <div class="total-amount" id="totalCommission">
      ₹0
    </div>

  </div>


  <div class="ref-box">

    <div class="ref-row">

      <span>
        My Referral Code
      </span>

      <span class="ref-code"
            id="myReferCode">
        -
      </span>

    </div>

    <div class="ref-row">

      <span>
        Referred Users
      </span>

      <span class="count"
            id="userCount">
        0
      </span>

    </div>

  </div>


  <div id="userList">

    <div class="loading">
      Loading...
    </div>

  </div>

</div>


<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
    "https://katbdbzoufiblnnsoxkk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a";


const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ================= GET CURRENT USER ================= */

function getCurrentUser(){

  const keys = [
    "user",
    "currentUser",
    "loginUser",
    "loggedUser"
  ];

  for(const key of keys){

    const data =
      localStorage.getItem(key);

    if(!data) continue;

    try{

      const user =
        JSON.parse(data);

      if(user){
        return user;
      }

    }
    catch(e){

      console.log(
        "LocalStorage parse error:",
        e
      );

    }

  }

  return null;

}


/* ================= LOAD COMMISSION ================= */

async function loadCommission(){

  const userList =
    document.getElementById("userList");

  userList.innerHTML = `
    <div class="loading">
      Loading...
    </div>
  `;


  try{

    /* ================= CURRENT USER ================= */

    const myUser =
      getCurrentUser();


    if(!myUser){

      userList.innerHTML = `
        <div class="error">
          User login information not found.
        </div>
      `;

      return;

    }


    const currentId =
      myUser.id ||
      myUser.user_id ||
      myUser.userId;


    if(!currentId){

      userList.innerHTML = `
        <div class="error">
          User ID not found.
        </div>
      `;

      return;

    }


    /* ================= CURRENT USER DATA ================= */

    const {
      data: currentUser,
      error: userError
    } = await client

      .from("login")

      .select(
        "id,name,mobile,refer_code,ref_by"
      )

      .eq(
        "id",
        currentId
      )

      .maybeSingle();


    if(userError){

      console.log(
        "CURRENT USER ERROR:",
        userError
      );

      throw userError;

    }


    if(!currentUser){

      userList.innerHTML = `
        <div class="error">
          Current user record not found.
        </div>
      `;

      return;

    }


    /* ================= MY REFERRAL CODE ================= */

    const myReferCode =
      currentUser.refer_code;


    document.getElementById(
      "myReferCode"
    ).textContent =
      myReferCode || "-";


    if(!myReferCode){

      document.getElementById(
        "userCount"
      ).textContent = "0";


      userList.innerHTML = `
        <div class="empty">
          Your referral code is not available.
        </div>
      `;

      return;

    }


    /* ================= REFERRED USERS ================= */

    const {
      data: referredUsers,
      error: refError
    } = await client

      .from("login")

      .select(
        "id,name,mobile,refer_code,ref_by"
      )

      .eq(
        "ref_by",
        myReferCode
      )

      .order(
        "id",
        {
          ascending:false
        }
      );


    if(refError){

      console.log(
        "REFERRED USERS ERROR:",
        refError
      );

      throw refError;

    }


    console.log(
      "MY REFER CODE:",
      myReferCode
    );

    console.log(
      "REFERRED USERS:",
      referredUsers
    );


    document.getElementById(
      "userCount"
    ).textContent =
      referredUsers
        ? referredUsers.length
        : 0;


    if(
      !referredUsers ||
      referredUsers.length === 0
    ){

      userList.innerHTML = `
        <div class="empty">
          No referred customers found.
        </div>
      `;

      document.getElementById(
        "totalCommission"
      ).textContent =
        "₹0";

      return;

    }


    /* ================= COMMISSION ================= */

    let totalCommission = 0;

    let html = "";


    for(
      const referredUser
      of referredUsers
    ){

      const {
        data: history,
        error: historyError
      } = await client

        .from("history")

        .select(
          "id,user_id,total,market,created_at,status,commission,ref_by"
        )

        .eq(
          "user_id",
          String(referredUser.id)
        )

        .eq(
          "ref_by",
          myReferCode
        )

        .order(
          "created_at",
          {
            ascending:false
          }
        );


      if(historyError){

        console.log(
          "HISTORY ERROR:",
          historyError
        );

      }


      let userCommission = 0;

      let historyHtml = "";


      if(
        history &&
        history.length > 0
      ){

        history.forEach(row => {

          const commission =
            Number(row.commission) || 0;


          userCommission +=
            commission;


          totalCommission +=
            commission;


          historyHtml += `

            <div class="history-item">

              <div>
                Market:
                <b>
                  ${row.market || "-"}
                </b>
              </div>

              <div>
                Total:
                ₹${Number(row.total || 0)}
              </div>

              <div>
                Status:
                ${row.status || "-"}
              </div>

              <div>
                Commission:
                <b class="commission">
                  ₹${commission}
                </b>
              </div>

            </div>

          `;

        });

      }


      /* ================= USER CARD ================= */

      html += `

        <div class="user-card">

          <div class="user-name">
            ${referredUser.name || "Customer"}
          </div>

          <div class="user-mobile">
            Mobile:
            ${referredUser.mobile || "-"}
          </div>

          <div class="user-ref">
            Referral Code:
            ${referredUser.refer_code || "-"}
          </div>

          <div class="user-ref">
            Referred By:
            ${referredUser.ref_by || "-"}
          </div>


          <div class="user-commission">

            <span>
              Commission
            </span>

            <span class="commission">
              ₹${userCommission}
            </span>

          </div>


          ${
            historyHtml
              ? historyHtml
              : `
                <div class="history-item">
                  No commission history
                </div>
              `
          }

        </div>

      `;

    }


    /* ================= SHOW DATA ================= */

    userList.innerHTML =
      html;


    document.getElementById(
      "totalCommission"
    ).textContent =
      "₹" + totalCommission;


  }
  catch(error){

    console.log(
      "COMMISSION PAGE ERROR:",
      error
    );


    userList.innerHTML = `

      <div class="error">

        Commission data load nahi ho raha.

        <br><br>

        ${error.message || error}

      </div>

    `;

  }

}


/* ================= START ================= */

loadCommission();

</script>

</body>

</html>
