<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UPI Payment</title>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.box{
    max-width:400px;
    margin:50px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

h2{
    text-align:center;
}

input{
    width:100%;
    height:50px;
    box-sizing:border-box;
    padding:10px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    height:50px;
    margin-top:15px;
    border:0;
    border-radius:8px;
    background:#ff9800;
    color:white;
    font-size:18px;
    font-weight:bold;
}

.upi{
    margin-top:20px;
    text-align:center;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

    <h2>UPI Payment</h2>

    <input
        id="amount"
        type="number"
        min="1"
        placeholder="Enter Amount"
    >

    <button onclick="payNow()">
        Pay Now
    </button>

    <div class="upi">
        7KW0568000@mairtel
    </div>

</div>


<script>

function payNow(){

    const amount =
        Number(document.getElementById("amount").value);

    if(!amount || amount <= 0){

        alert("Amount enter karo");

        return;
    }

    const upiId =
        "7KW0568000@mairtel";

    const upiUrl =
        "upi://pay" +
        "?pa=" + encodeURIComponent(upiId) +
        "&am=" + encodeURIComponent(amount.toFixed(2)) +
        "&cu=INR";

    window.location.href = upiUrl;
}

</script>

</body>

</html>
