<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay</title>
</head>

<body>

<input
  id="amount"
  type="number"
  placeholder="Amount"
>

<button onclick="pay()">
  Pay
</button>

<script>

function pay(){

    const amount =
        document.getElementById("amount").value;

    if(!amount){
        alert("Amount bharo");
        return;
    }

    const upi =
        "7KW0568000@mairtel";

    const url =
        "upi://pay?pa=" +
        upi +
        "&am=" +
        amount +
        "&cu=INR";

    location.href = url;
}

</script>

</body>
</html>
