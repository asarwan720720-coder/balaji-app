<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Deposit</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#f7f8fa,#e9edf2);
  min-height:100vh;
  padding:20px 12px;
  color:#222;
}

.depositBox{
  width:100%;
  max-width:430px;
  margin:auto;
}

.depositCard{
  background:#fff;
  border-radius:22px;
  padding:22px;
  box-shadow:0 8px 25px rgba(0,0,0,.10);
}

.title{
  text-align:center;
  margin-bottom:22px;
}

.titleIcon{
  font-size:42px;
}

.title h2{
  margin:7px 0 4px;
  font-size:25px;
}

.title p{
  margin:0;
  color:#777;
  font-size:14px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:8px;
}

.amountInput{
  width:100%;
  height:55px;
  padding:0 15px;
  border:2px solid #e1e1e1;
  border-radius:13px;
  font-size:21px;
  outline:none;
  transition:.2s;
}

.amountInput:focus{
  border-color:#159447;
}

.quickTitle{
  margin-top:18px;
  margin-bottom:9px;
  font-size:13px;
  color:#666;
}

.quickAmounts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.quickBtn{
  border:1px solid #ddd;
  background:#fafafa;
  border-radius:10px;
  padding:11px 5px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.quickBtn:active{
  transform:scale(.96);
}

.payBtn{
  width:100%;
  height:54px;
  margin-top:18px;
  border:0;
  border-radius:13px;
  background:#159447;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(21,148,71,.25);
}

.payBtn:active{
  transform:scale(.98);
}

.payBtn:disabled{
  background:#999;
  cursor:not-allowed;
}

.upiInfo{
  margin-top:15px;
  padding:14px;
  background:#f5f7f6;
  border:1px solid #e4e4e4;
  border-radius:12px;
  text-align:center;
  font-size:13px;
  color:#666;
}

.upiId{
  display:block;
  margin-top:5px;
  color:#222;
  font-size:15px;
  font-weight:bold;
}

.currentRequest{
  display:none;
  margin-top:16px;
  padding:15px;
  border-radius:13px;
  background:#fff8df;
  border:1px solid #f1d36b;
}

.currentTitle{
  font-weight:bold;
  margin-bottom:6px;
}

.currentText{
  font-size:13px;
  color:#666;
}

.historyCard{
  margin-top:18px;
  background:#fff;
  border-radius:22px;
  padding:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.historyHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.historyHeader h3{
  margin:0;
  font-size:19px;
}

.refreshText{
  font-size:12px;
  color:#888;
}

.historyItem{
  border:1px solid #e8e8e8;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  background:#fff;
}

.historyTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.amountText{
  font-size:18px;
  font-weight:bold;
}

.status{
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.pending{
  background:#fff3cd;
  color:#9a7200;
}

.accepted{
  background:#d9f7e5;
  color:#087a36;
}

.cancelled{
  background:#ffe0e0;
  color:#b40000;
}

.historyDate{
  margin-top:8px;
  font-size:12px;
  color:#888;
}

.emptyHistory{
  text-align:center;
  padding:25px 10px;
  color:#888;
  font-size:14px;
}

.loading{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:14px;
}

.errorBox{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#ffe5e5;
  color:#b00000;
  font-size:13px;
}

</style>

</head>

<body>

<div class="depositBox">

  <div class="depositCard">

    <div class="title">

      <div class="titleIcon">
        💰
      </div>

      <h2>Add Money</h2>

      <p>
        Enter amount and make your payment
      </p>

    </div>

    <label>
      Enter Amount
    </label>

    <input
      id="amount"
      class="amountInput"
      type="number"
      inputmode="decimal"
      min="1"
      step="1"
      placeholder="Enter amount">

    <div class="quickTitle">
      Quick Amount
    </div>

    <div class="quickAmounts">

      <button
        class="quickBtn"
        onclick="setAmount(100)">
        ₹100
      </button>

      <button
        class="quickBtn"
        onclick="setAmount(200)">
        ₹200
      </button>

      <button
        class="quickBtn"
        onclick="setAmount(500)">
        ₹500
      </button>

      <button
        class="quickBtn"
        onclick="setAmount(1000)">
        ₹1000
      </button>

    </div>

    <button
      id="payBtn"
      class="payBtn"
      onclick="payNow()">

      Pay Now

    </button>

    <div class="upiInfo">

      Payment UPI

      <span class="upiId">
        7KW0568000@mairtel
      </span>

    </div>

    <div
      id="errorBox"
      class="errorBox">
    </div>

    <div
      id="currentRequest"
      class="currentRequest">

      <div class="currentTitle">
        🟡 Deposit Request Pending
      </div>

      <div
        id="currentText"
        class="currentText">
      </div>

    </div>

  </div>

  <div class="historyCard">

    <div class="historyHeader">

      <h3>
        Deposit History
      </h3>

      <span class="refreshText">
        Auto refresh
      </span>

    </div>

    <div
      id="historyList"
      class="loading">

      Loading history...

    </div>

  </div>

</div>

<script>

// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
"https://katbdbzoufiblnnsoxkk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// =====================================================
// USER ID
// =====================================================

const userId =
localStorage.getItem("user_id");


// =====================================================
// QUICK AMOUNT
// =====================================================

function setAmount(value){

  document.getElementById("amount").value =
    value;

}


// =====================================================
// ERROR
// =====================================================

function showError(message){

  const box =
    document.getElementById("errorBox");

  box.innerText =
    message;

  box.style.display =
    "block";

}


function hideError(){

  document.getElementById("errorBox")
    .style.display = "none";

}


// =====================================================
// PAY NOW
// =====================================================

async function payNow(){

  hideError();

  const amountInput =
    document.getElementById("amount");

  const payBtn =
    document.getElementById("payBtn");

  const amount =
    Number(amountInput.value);


  // ===============================
  // VALIDATE
  // ===============================

  if(
    !Number.isFinite(amount) ||
    amount <= 0
  ){

    showError(
      "Pehle valid amount enter karein."
    );

    amountInput.focus();

    return;

  }


  if(!userId){

    showError(
      "User ID nahi mili. Pehle login karein."
    );

    return;

  }


  // ===============================
  // BUTTON LOADING
  // ===============================

  payBtn.disabled = true;

  payBtn.innerText =
    "Request bheji ja rahi hai...";


  // ===============================
  // CREATE REQUEST
  // ===============================

  const {
    data,
    error
  } =
    await supabaseClient
    .from("deposit_requests")
    .insert({

      user_id: userId,
      amount: amount,
      status: "pending"

    })
    .select()
    .single();


  if(error){

    console.error(error);

    payBtn.disabled = false;

    payBtn.innerText =
      "Pay Now";

    showError(
      "Deposit request nahi ja saki."
    );

    return;

  }


  // ===============================
  // SHOW REQUEST
  // ===============================

  showCurrentRequest(data);

  amountInput.value = "";

  loadHistory();


  // =================================================
  // UPI PAYMENT
  // =================================================

  const upiId =
    "7KW0568000@mairtel";

  const payeeName =
    "BALAJI-DAS";

  const transactionId =
    "DEP" + Date.now();


  /*
    Full UPI intent.
    Existing parameters retained.
  */

  const upiUrl =
    "upi://pay" +

    "?pa=" +
    encodeURIComponent(upiId) +

    "&pn=" +
    encodeURIComponent(payeeName) +

    "&am=" +
    encodeURIComponent(
      amount.toFixed(2)
    ) +

    "&cu=INR" +

    "&tr=" +
    encodeURIComponent(
      transactionId
    );


  console.log(
    "UPI URL:",
    upiUrl
  );


  // =================================================
  // OPEN UPI APP
  // =================================================

  try{

    window.location.href =
      upiUrl;

  }

  catch(error){

    console.error(error);

    showError(
      "UPI payment app open nahi ho saki."
    );

  }


  payBtn.disabled = false;

  payBtn.innerText =
    "Pay Now";

}


// =====================================================
// CURRENT REQUEST
// =====================================================

function showCurrentRequest(request){

  const box =
    document.getElementById(
      "currentRequest"
    );

  const text =
    document.getElementById(
      "currentText"
    );

  box.style.display =
    "block";

  text.innerText =
    "₹" +
    Number(request.amount).toFixed(0) +
    " request bheji gayi hai. Admin ke accept karne tak Pending rahegi.";

}


// =====================================================
// LOAD HISTORY
// =====================================================

async function loadHistory(){

  const historyList =
    document.getElementById(
      "historyList"
    );


  if(!userId){

    historyList.innerHTML =
      '<div class="emptyHistory">User login nahi hai.</div>';

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
    .from("deposit_requests")
    .select("*")
    .eq(
      "user_id",
      userId
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    historyList.innerHTML =
      '<div class="emptyHistory">History load nahi ho saki.</div>';

    return;

  }


  if(!data || data.length === 0){

    historyList.innerHTML =
      '<div class="emptyHistory">Abhi koi deposit request nahi hai.</div>';

    return;

  }


  let html = "";


  data.forEach(item => {

    const status =
      String(
        item.status || "pending"
      ).toLowerCase();


    let statusClass =
      "pending";

    let statusText =
      "Pending";


    if(
      status === "accepted" ||
      status === "accept" ||
      status === "clear" ||
      status === "approved"
    ){

      statusClass =
        "accepted";

      statusText =
        "Accepted";

    }


    if(
      status === "cancelled" ||
      status === "canceled" ||
      status === "cancel"
    ){

      statusClass =
        "cancelled";

      statusText =
        "Cancelled";

    }


    const date =
      formatDate(
        item.created_at
      );


    html += `

      <div class="historyItem">

        <div class="historyTop">

          <div class="amountText">
            ₹${Number(item.amount).toFixed(0)}
          </div>

          <div class="status ${statusClass}">
            ${statusText}
          </div>

        </div>

        <div class="historyDate">
          ${date}
        </div>

      </div>

    `;

  });


  historyList.innerHTML =
    html;


  const latest =
    data[0];


  if(latest){

    const latestStatus =
      String(
        latest.status || "pending"
      ).toLowerCase();


    if(
      latestStatus === "pending"
    ){

      showCurrentRequest(
        latest
      );

    }

    else{

      document.getElementById(
        "currentRequest"
      ).style.display =
        "none";

    }

  }

}


// =====================================================
// DATE FORMAT
// =====================================================

function formatDate(dateValue){

  if(!dateValue){
    return "";
  }


  const date =
    new Date(
      dateValue
    );


  return date.toLocaleString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


// =====================================================
// INITIAL LOAD
// =====================================================

loadHistory();


// =====================================================
// AUTO REFRESH
// =====================================================

setInterval(
  loadHistory,
  5000
);

</script>

</body>

</html>
