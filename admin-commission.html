function getHistoryTotal(data){

    let total = 0;

    try{

        let arr = data;

        if(typeof arr === "string"){
            arr = JSON.parse(arr);
        }

        if(!Array.isArray(arr)){
            return 0;
        }

        arr.forEach(item => {

            if(!item) return;

            let amount = Number(
                item.amount ??
                item.points ??
                item.a ??
                0
            );

            if(!Number.isFinite(amount)) return;

            total += amount;

        });

    }catch(error){

        console.error(
            "History data error:",
            error
        );

    }

    return total;
}

function getDateOnly(date){

    const d = new Date(date);

    const day =
        String(d.getDate()).padStart(2,"0");

    const month =
        String(d.getMonth()+1).padStart(2,"0");

    const year =
        d.getFullYear();

    return `${day}/${month}/${year}`;
}


function getDateTime(date){

    const d = new Date(date);

    return d.toLocaleString("en-IN",{
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit",
        hour12:true
    });
}
