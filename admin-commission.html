<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Commission</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    color:#222;
}

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

h2{
    text-align:center;
    margin:10px 0 15px;
}


/* ================= TOTAL ================= */

.total-box{
    background:white;
    border-radius:15px;
    padding:18px;
    text-align:center;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.total-title{
    font-size:14px;
    color:#777;
}

.total-amount{
    margin-top:6px;
    font-size:28px;
    font-weight:bold;
    color:#16a34a;
}


/* ================= FILTERS ================= */

.filters{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:15px;
}

select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    background:white;
    font-size:15px;
    outline:none;
}


/* ================= CARD ================= */

.commission-card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.user-id{
    font-size:14px;
    color:#666;
}

.commission{
    font-size:18px;
    font-weight:bold;
    color:#16a34a;
}

.market{
    text-align:center;
    font-size:16px;
    font-weight:bold;
    margin:10px 0 6px;
    color:#333;
}

.amount-row{
    display:flex;
    justify-content:space-between;
    padding-top:8px;
    border-top:1px solid #eee;
    font-size:14px;
}

.date-time{
    color:#777;
    font-size:13px;
}


/* ================= STATUS ================= */

.status{
    display:inline-block;
    margin-top:8px;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.status-accepted{
    background:#dcfce7;
    color:#15803d;
}

.status-pending{
    background:#fef3c7;
    color:#a16207;
}

.status-cancelled{
    background:#fee2e2;
    color:#b91c1c;
}

.status-other{
    background:#eee;
    color:#555;
}


/* ================= LOADING ================= */

#loading{
    text-align:center;
    padding:25px;
    color:#777;
}


/* ================= NO DATA ================= */

#noData{
    text-align:center;
    padding:25px;
    color:#777;
    background:white;
    border-radius:12px;
    display:none;
}


/* ================= ERROR ================= */

#errorBox{
    display:none;
    background:white;
    color:#d32f2f;
    padding:18px;
    border-radius:12px;
    text-align:center;
    margin-top:10px;
    word-break:break-word;
}

</style>

</head>


<body>


<div class="container">


    <h2>Admin Commission</h2>


    <!-- ================= TOTAL ================= -->

    <div class="total-box">

        <div class="total-title">
            Total Commission
        </div>

        <div
            class="total-amount"
            id="totalCommission"
        >
            ₹0
        </div>

    </div>


    <!-- ================= FILTERS ================= -->

    <div class="filters">

        <select id="idFilter">

            <option value="all">
                All ID
            </option>

        </select>


        <select id="dateFilter">

            <option value="all">
                All Date
            </option>

        </select>


        <select id="marketFilter">

            <option value="all">
                All Market
            </option>

        </select>

    </div>


    <div id="loading">
        Loading...
    </div>


    <div id="errorBox"></div>


    <div id="noData">
        Commission data nahi mili.
    </div>


    <div id="commissionList"></div>


</div>



<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://katbdbzoufiblnnsoxkk.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =====================================================
   GLOBAL DATA
===================================================== */

let allCommissions = [];



/* =====================================================
   HTML SAFE
===================================================== */

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}



/* =====================================================
   DATE ONLY
===================================================== */

function getDateOnly(date){

    if(!date){
        return "-";
    }

    const d = new Date(date);

    if(Number.isNaN(d.getTime())){
        return "-";
    }

    const day =
        String(d.getDate()).padStart(2,"0");

    const month =
        String(d.getMonth()+1).padStart(2,"0");

    const year =
        d.getFullYear();

    return `${day}/${month}/${year}`;

}



/* =====================================================
   DATE TIME
===================================================== */

function getDateTime(date){

    if(!date){
        return "-";
    }

    const d = new Date(date);

    if(Number.isNaN(d.getTime())){
        return "-";
    }

    return d.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit",
            hour12:true
        }
    );

}



/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(status){

    const value =
        String(status || "").toLowerCase();

    if(value === "accepted" ||
       value === "clear"){

        return "status-accepted";

    }

    if(value === "pending"){

        return "status-pending";

    }

    if(value === "cancelled" ||
       value === "canceled"){

        return "status-cancelled";

    }

    return "status-other";

}



/* =====================================================
   LOAD COMMISSION DATA
===================================================== */

async function loadCommissionData(){

    const loading =
        document.getElementById("loading");

    const errorBox =
        document.getElementById("errorBox");

    const noData =
        document.getElementById("noData");

    const list =
        document.getElementById("commissionList");


    loading.style.display = "block";

    errorBox.style.display = "none";

    noData.style.display = "none";

    list.innerHTML = "";

    document.getElementById(
        "totalCommission"
    ).textContent = "₹0";


    try{


        /* =================================================
           COMMISSION RECORDS
        ================================================= */

        const {
            data: commissionData,
            error: commissionError
        } = await supabaseClient

            .from("commission_records")

            .select(`
                id,
                user_id,
                total,
                ref_by,
                referral_id,
                commission_amount,
                commission_percent,
                status,
                history_id,
                created_at
            `)

            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(commissionError){
            throw commissionError;
        }


        allCommissions =
            commissionData || [];



        /* =================================================
           HISTORY DATA
        ================================================= */

        const historyIds = [
            ...new Set(
                allCommissions
                    .map(row => row.history_id)
                    .filter(Boolean)
            )
        ];


        let historyMap =
            new Map();


        if(historyIds.length > 0){

            const {
                data: historyData,
                error: historyError
            } = await supabaseClient

                .from("history")

                .select(
                    "id,market"
                )

                .in(
                    "id",
                    historyIds
                );


            if(historyError){
                throw historyError;
            }


            (historyData || []).forEach(row => {

                historyMap.set(
                    String(row.id),
                    row.market || "-"
                );

            });

        }



        /* =================================================
           LOGIN DATA
        ================================================= */

        const userIds = [
            ...new Set(
                allCommissions
                    .map(row => row.user_id)
                    .filter(Boolean)
            )
        ];


        let userMap =
            new Map();


        if(userIds.length > 0){

            const {
                data: users,
                error: usersError
            } = await supabaseClient

                .from("login")

                .select(
                    "id,name,mobile"
                )

                .in(
                    "id",
                    userIds
                );


            if(usersError){
                throw usersError;
            }


            (users || []).forEach(user => {

                userMap.set(
                    String(user.id),
                    user
                );

            });

        }



        /* =================================================
           DATA KO COMPLETE FORMAT MEIN BANANA
        ================================================= */

        allCommissions =
            allCommissions.map(row => {

                const user =
                    userMap.get(
                        String(row.user_id)
                    );


                return {

                    ...row,

                    user_name:
                        user?.name || "Customer",

                    mobile:
                        user?.mobile || "-",

                    market:
                        historyMap.get(
                            String(row.history_id)
                        ) || "-"

                };

            });



        loading.style.display = "none";



        /* =================================================
           NO DATA
        ================================================= */

        if(allCommissions.length === 0){

            noData.style.display = "block";

            return;

        }



        /* =================================================
           DROPDOWNS
        ================================================= */

        fillFilters();



        /* =================================================
           SHOW DATA
        ================================================= */

        renderCommission();

    }
    catch(error){

        console.error(
            "ADMIN COMMISSION ERROR:",
            error
        );


        loading.style.display = "none";

        errorBox.style.display = "block";

        errorBox.innerHTML = `
            Commission data load nahi ho raha.
            <br><br>
            ${escapeHTML(
                error.message || String(error)
            )}
        `;

    }

}



/* =====================================================
   FILL FILTERS
===================================================== */

function fillFilters(){

    const idFilter =
        document.getElementById("idFilter");

    const dateFilter =
        document.getElementById("dateFilter");

    const marketFilter =
        document.getElementById("marketFilter");


    idFilter.innerHTML = `
        <option value="all">
            All ID
        </option>
    `;


    dateFilter.innerHTML = `
        <option value="all">
            All Date
        </option>
    `;


    marketFilter.innerHTML = `
        <option value="all">
            All Market
        </option>
    `;



    /* ================= ID ================= */

    const ids = [
        ...new Set(
            allCommissions
                .map(row => row.user_id)
                .filter(Boolean)
                .map(id => String(id))
        )
    ];


    ids.forEach(id => {

        const option =
            document.createElement("option");

        option.value = id;

        option.textContent = id;

        idFilter.appendChild(option);

    });



    /* ================= DATE ================= */

    const dates = [
        ...new Set(
            allCommissions
                .map(row =>
                    getDateOnly(row.created_at)
                )
        )
    ];


    dates.forEach(date => {

        const option =
            document.createElement("option");

        option.value = date;

        option.textContent = date;

        dateFilter.appendChild(option);

    });



    /* ================= MARKET ================= */

    const markets = [
        ...new Set(
            allCommissions
                .map(row => row.market)
                .filter(Boolean)
        )
    ];


    markets.forEach(market => {

        const option =
            document.createElement("option");

        option.value = market;

        option.textContent = market;

        marketFilter.appendChild(option);

    });

}



/* =====================================================
   FILTER + RENDER
===================================================== */

function renderCommission(){

    const idValue =
        document.getElementById("idFilter").value;

    const dateValue =
        document.getElementById("dateFilter").value;

    const marketValue =
        document.getElementById("marketFilter").value;


    const filtered =
        allCommissions.filter(row => {


            /* ================= ID ================= */

            if(
                idValue !== "all" &&
                String(row.user_id) !== idValue
            ){

                return false;

            }



            /* ================= DATE ================= */

            if(
                dateValue !== "all" &&
                getDateOnly(row.created_at)
                !== dateValue
            ){

                return false;

            }



            /* ================= MARKET ================= */

            if(
                marketValue !== "all" &&
                String(row.market)
                !== String(marketValue)
            ){

                return false;

            }


            return true;

        });



    /* =================================================
       TOTAL COMMISSION
       
       Accepted/Clear ko total mein count karna
       Pending/Cancelled ko nahi.
    ================================================= */

    let total = 0;


    filtered.forEach(row => {

        const status =
            String(
                row.status || ""
            ).toLowerCase();


        if(
            status === "accepted" ||
            status === "clear"
        ){

            total +=
                Number(
                    row.commission_amount
                ) || 0;

        }

    });


    document.getElementById(
        "totalCommission"
    ).textContent =
        "₹" + total.toFixed(2);



    /* =================================================
       NO FILTERED DATA
    ================================================= */

    const noData =
        document.getElementById("noData");

    const list =
        document.getElementById("commissionList");


    if(filtered.length === 0){

        list.innerHTML = "";

        noData.style.display = "block";

        return;

    }


    noData.style.display = "none";



    /* =================================================
       CARDS
    ================================================= */

    let html = "";


    filtered.forEach(row => {


        const commission =
            Number(
                row.commission_amount
            ) || 0;


        const totalAmount =
            Number(
                row.total
            ) || 0;


        const status =
            row.status || "unknown";


        const statusClass =
            getStatusClass(status);



        html += `

            <div class="commission-card">


                <div class="top-row">

                    <div>

                        <div class="user-id">
                            ID: ${escapeHTML(row.user_id)}
                        </div>

                        <div style="
                            font-weight:bold;
                            margin-top:4px;
                        ">
                            ${escapeHTML(row.user_name)}
                        </div>

                    </div>


                    <div class="commission">
                        ₹${commission.toFixed(2)}
                    </div>

                </div>


                <div class="market">
                    ${escapeHTML(row.market)}
                </div>


                <div class="amount-row">

                    <span>
                        Total: ₹${totalAmount.toFixed(2)}
                    </span>

                    <span class="date-time">
                        ${escapeHTML(
                            getDateTime(row.created_at)
                        )}
                    </span>

                </div>


                <span class="
                    status
                    ${statusClass}
                ">
                    ${escapeHTML(status)}
                </span>


            </div>

        `;

    });


    list.innerHTML = html;

}



/* =====================================================
   FILTER EVENTS
===================================================== */

document.getElementById(
    "idFilter"
).addEventListener(
    "change",
    renderCommission
);


document.getElementById(
    "dateFilter"
).addEventListener(
    "change",
    renderCommission
);


document.getElementById(
    "marketFilter"
).addEventListener(
    "change",
    renderCommission
);



/* =====================================================
   START
===================================================== */

loadCommissionData();

</script>

</body>
</html>
