<script>

/* ================= SUPABASE ================= */

const supabaseClient = supabase.createClient(

    "https://katbdbzoufiblnnsoxkk.supabase.co",

    "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"

);


/* ================= GLOBAL DATA ================= */

let allWining = [];
let historyMap = {};
let selectedDate = "";
let selectedMarket = "";
let selectedResult = "";


/* ================= PAGE LOAD ================= */

document.addEventListener("DOMContentLoaded", async () => {

    await loadDates();

});


/* ================= LOAD DATES ================= */

async function loadDates(){

    const select = document.getElementById("dateSelect");

    select.innerHTML =
        `<option value="">Date Select करें</option>`;

    const { data, error } = await supabaseClient
        .from("history")
        .select("created_at")
        .not("created_at", "is", null)
        .order("created_at", { ascending:false });

    if(error){

        console.error(error);

        select.innerHTML =
            `<option value="">Date load नहीं हुई</option>`;

        return;
    }

    const dates = new Set();

    data.forEach(row => {

        if(!row.created_at) return;

        const d = new Date(row.created_at);

        const date =
            d.getFullYear() +
            "-" +
            String(d.getMonth()+1).padStart(2,"0") +
            "-" +
            String(d.getDate()).padStart(2,"0");

        dates.add(date);

    });

    [...dates].forEach(date => {

        const option =
            document.createElement("option");

        option.value = date;

        option.textContent =
            formatDate(date);

        select.appendChild(option);

    });

}


/* ================= DATE CHANGE ================= */

document.getElementById("dateSelect")
.addEventListener("change", async function(){

    selectedDate = this.value;

    document.getElementById("marketSelect").innerHTML =
        `<option value="">Market Select करें</option>`;

    document.getElementById("resultInfo").style.display = "none";

    if(!selectedDate){

        return;
    }

    await loadMarkets(selectedDate);

});


/* ================= LOAD MARKETS ================= */

async function loadMarkets(date){

    const marketSelect =
        document.getElementById("marketSelect");

    const { data, error } = await supabaseClient
        .from("history")
        .select("market,created_at")
        .not("market","is",null)
        .not("created_at","is",null);

    if(error){

        console.error(error);
        return;

    }

    const markets = new Set();

    data.forEach(row => {

        const rowDate =
            getLocalDate(row.created_at);

        if(rowDate === date){

            markets.add(row.market);

        }

    });

    [...markets]
    .sort()
    .forEach(market => {

        const option =
            document.createElement("option");

        option.value = market;
        option.textContent = market;

        marketSelect.appendChild(option);

    });

}


/* ================= MARKET CHANGE ================= */

document.getElementById("marketSelect")
.addEventListener("change", function(){

    selectedMarket = this.value;

});


/* ================= RESULT INPUT ================= */

document.getElementById("resultInput")
.addEventListener("input", function(){

    this.value =
        this.value.replace(/[^0-9]/g,"").slice(0,2);

});


/* ================= LOAD WINING ================= */

async function loadWining(){

    selectedDate =
        document.getElementById("dateSelect").value;

    selectedMarket =
        document.getElementById("marketSelect").value;

    selectedResult =
        document.getElementById("resultInput").value.trim();

    if(!selectedDate){

        alert("पहले Date select करें");
        return;

    }

    if(!selectedMarket){

        alert("पहले Market select करें");
        return;

    }

    if(!/^[0-9]{2}$/.test(selectedResult)){

        alert("Result 00 से 99 के बीच 2 digit का डालें");
        return;

    }

    showLoading();

    /*
      पहले Game result में result save/update होगा
    */
    await updateGameResult(
        selectedDate,
        selectedMarket,
        selectedResult
    );

    /*
      फिर उस date/market की winning entries load होंगी
    */
    await fetchWining();

}


/* ================= UPDATE GAME RESULT ================= */

async function updateGameResult(
    date,
    market,
    result
){

    /*
      Exact date + market की row ढूँढेंगे
    */

    const { data, error } = await supabaseClient
        .from("Game result")
        .select("id,name,date,number")
        .eq("name", market)
        .eq("date", date)
        .limit(1);

    if(error){

        console.error("Game result error:", error);

        alert(
            "Game result पढ़ने में error आया.\n\n" +
            error.message
        );

        return false;
    }

    if(!data || data.length === 0){

        /*
          अगर exact date row नहीं मिली,
          तो केवल warning देंगे।
        */

        console.warn(
            "Game result row नहीं मिली:",
            date,
            market
        );

        return false;
    }

    const resultId = data[0].id;

    const { error:updateError } =
        await supabaseClient
        .from("Game result")
        .update({
            number: result
        })
        .eq("id", resultId);

    if(updateError){

        console.error(updateError);

        alert(
            "Result update नहीं हुआ.\n\n" +
            updateError.message
        );

        return false;
    }

    return true;

}


/* ================= FETCH WINING ================= */

async function fetchWining(){

    /*
      सभी wining rows
    */

    const { data:winingData, error:winingError } =
        await supabaseClient
        .from("wining")
        .select("*")
        .order("id", {ascending:false});

    if(winingError){

        console.error(winingError);

        document.getElementById("winingList").innerHTML =
            `<div class="empty">
                Wining data load नहीं हुआ.<br><br>
                ${escapeHtml(winingError.message)}
            </div>`;

        return;
    }

    allWining = winingData || [];

    /*
      History IDs निकालना
    */

    const historyIds =
        allWining
        .map(x => x.history_id)
        .filter(x => x !== null && x !== undefined);

    historyMap = {};

    if(historyIds.length > 0){

        const uniqueIds =
            [...new Set(historyIds)];

        const { data:historyData, error:historyError } =
            await supabaseClient
            .from("history")
            .select("id,created_at,market")
            .in("id", uniqueIds);

        if(historyError){

            console.error(historyError);

        }else{

            (historyData || []).forEach(h => {

                historyMap[h.id] = h;

            });

        }

    }

    renderWining();

}


/* ================= RESULT MATCHING ================= */

function getWinningAmount(row){

    const number =
        String(row.number || "").trim().toUpperCase();

    const result =
        String(selectedResult).padStart(2,"0");

    const bet =
        Number(row.bet_amount || 0);

    /*
      Exact Number
      Example 56 => 56 x 92
    */

    if(number === result){

        return bet * 92;

    }

    /*
      A first digit
      Example result 56 => A5
    */

    if(number === "A" + result.charAt(0)){

        return bet * 9;

    }

    /*
      B second digit
      Example result 56 => B6
    */

    if(number === "B" + result.charAt(1)){

        return bet * 9;

    }

    return 0;

}


/* ================= RENDER ================= */

function renderWining(){

    const list =
        document.getElementById("winingList");

    let rows = [];

    /*
      Selected date + market
    */

    allWining.forEach(row => {

        const history =
            historyMap[row.history_id];

        let rowDate = null;
        let rowMarket = row.market;

        if(history){

            rowDate =
                getLocalDate(history.created_at);

            if(!rowMarket){

                rowMarket =
                    history.market;

            }

        }else if(row.created_at){

            rowDate =
                getLocalDate(row.created_at);

        }

        if(rowDate !== selectedDate){

            return;

        }

        if(
            String(rowMarket || "").trim().toLowerCase()
            !==
            String(selectedMarket || "").trim().toLowerCase()
        ){

            return;

        }

        rows.push(row);

    });


    /*
      Result matching amount
    */

    rows.forEach(row => {

        row.calculated_amount =
            getWinningAmount(row);

    });


    /*
      Stats
    */

    const pendingRows =
        rows.filter(
            x => x.status === "pending"
        );

    const acceptedRows =
        rows.filter(
            x => x.status === "accepted"
        );

    const totalWinning =
        pendingRows.reduce(
            (sum,row) =>
                sum + Number(row.calculated_amount || 0),
            0
        );

    document.getElementById("pendingCount")
        .textContent = pendingRows.length;

    document.getElementById("acceptedCount")
        .textContent = acceptedRows.length;

    document.getElementById("totalWinning")
        .textContent =
        "₹" + totalWinning.toLocaleString("en-IN");


    /*
      Result info
    */

    document.getElementById("resultInfo")
        .style.display = "block";

    document.getElementById("infoMarket")
        .textContent = selectedMarket;

    document.getElementById("infoDate")
        .textContent = formatDate(selectedDate);

    document.getElementById("infoResult")
        .textContent = selectedResult;


    /*
      Nothing
    */

    if(rows.length === 0){

        list.innerHTML =
            `<div class="empty">
                इस Date और Market की कोई winning entry नहीं मिली.
            </div>`;

        return;

    }


    list.innerHTML = "";

    rows.forEach(row => {

        const card =
            document.createElement("div");

        card.className = "card";

        const status =
            String(row.status || "pending")
            .toLowerCase();

        const calculated =
            Number(row.calculated_amount || 0);

        const currentAmount =
            Number(row.amount || 0);

        /*
          Pending में calculated amount दिखाएँ.
          Accepted में existing amount.
        */

        const displayAmount =
            status === "pending"
            ? calculated
            : currentAmount;


        card.innerHTML = `

            <div class="card-top">

                <div class="market-name">
                    ${escapeHtml(row.market || selectedMarket)}
                </div>

                <div class="status ${status}">
                    ${statusText(status)}
                </div>

            </div>


            <div class="details">

                <div class="detail">
                    <div class="detail-title">
                        User ID
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(row.user_id || "-")}
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Number
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(row.number || "-")}
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Bet Amount
                    </div>

                    <div class="detail-value">
                        ₹${Number(row.bet_amount || 0)
                        .toLocaleString("en-IN")}
                    </div>
                </div>


                <div class="detail">
                    <div class="detail-title">
                        Winning
                    </div>

                    <div class="detail-value win-amount">
                        ₹${displayAmount
                        .toLocaleString("en-IN")}
                    </div>
                </div>

            </div>


            ${
                status === "pending"
                ?
                `
                <div class="actions">

                    <button
                        class="accept-btn"
                        onclick="acceptWining(
                            ${Number(row.id)},
                            ${calculated}
                        )">

                        ✓ ACCEPT

                    </button>


                    <button
                        class="cancel-btn"
                        onclick="cancelWining(
                            ${Number(row.id)}
                        )">

                        ✕ CANCEL

                    </button>

                </div>
                `
                :
                ""
            }

        `;

        list.appendChild(card);

    });

}


/* ================= ACCEPT ================= */

async function acceptWining(
    id,
    winningAmount
){

    if(!winningAmount || winningAmount <= 0){

        alert(
            "इस entry के लिए winning amount 0 है."
        );

        return;

    }


    const ok =
        confirm(
            "Winning Accept करें?\n\n" +
            "Amount: ₹" +
            Number(winningAmount)
            .toLocaleString("en-IN")
        );

    if(!ok) return;


    /*
      पहले current row दोबारा पढ़ेंगे
      ताकि double accept न हो
    */

    const { data, error } =
        await supabaseClient
        .from("wining")
        .select("id,status")
        .eq("id", id)
        .single();

    if(error){

        alert(
            "Entry verify नहीं हुई.\n\n" +
            error.message
        );

        return;
    }


    if(data.status !== "pending"){

        alert(
            "यह entry पहले ही process हो चुकी है.\n" +
            "Status: " + data.status
        );

        await fetchWining();

        return;

    }


    /*
      Amount और status दोनों update
    */

    const { error:updateError } =
        await supabaseClient
        .from("wining")
        .update({

            amount: winningAmount,
            status: "accepted"

        })
        .eq("id", id)
        .eq("status", "pending");


    if(updateError){

        console.error(updateError);

        alert(
            "Accept नहीं हुआ.\n\n" +
            updateError.message
        );

        return;
    }


    /*
      Existing database trigger:
      pending -> accepted
      = login.balance में amount add
    */

    alert(
        "✓ Winning Accepted\n\n" +
        "₹" +
        Number(winningAmount)
        .toLocaleString("en-IN") +
        " wallet में add होगा."
    );


    await fetchWining();

}


/* ================= CANCEL ================= */

async function cancelWining(id){

    const ok =
        confirm(
            "क्या आप इस winning को Cancel करना चाहते हैं?"
        );

    if(!ok) return;


    /*
      Double processing रोकना
    */

    const { data, error } =
        await supabaseClient
        .from("wining")
        .select("id,status")
        .eq("id", id)
        .single();


    if(error){

        alert(
            "Entry verify नहीं हुई.\n\n" +
            error.message
        );

        return;

    }


    if(data.status !== "pending"){

        alert(
            "यह entry पहले ही process हो चुकी है.\n" +
            "Status: " + data.status
        );

        await fetchWining();

        return;

    }


    const { error:updateError } =
        await supabaseClient
        .from("wining")
        .update({

            status: "cancelled"

        })
        .eq("id", id)
        .eq("status", "pending");


    if(updateError){

        console.error(updateError);

        alert(
            "Cancel नहीं हुआ.\n\n" +
            updateError.message
        );

        return;

    }


    alert("✕ Winning Cancelled");

    await fetchWining();

}


/* ================= HELPERS ================= */

function getLocalDate(dateString){

    if(!dateString) return null;

    const d = new Date(dateString);

    return (
        d.getFullYear() +
        "-" +
        String(d.getMonth()+1).padStart(2,"0") +
        "-" +
        String(d.getDate()).padStart(2,"0")
    );

}


function formatDate(date){

    if(!date) return "-";

    const parts =
        date.split("-");

    if(parts.length !== 3){

        return date;

    }

    return (
        parts[2] +
        "-" +
        parts[1] +
        "-" +
        parts[0]
    );

}


function statusText(status){

    if(status === "accepted")
        return "ACCEPTED";

    if(status === "cancelled")
        return "CANCELLED";

    return "PENDING";

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function showLoading(){

    document.getElementById("winingList")
        .innerHTML =
        `<div class="loading">
            Winning data load हो रहा है...
        </div>`;

}
