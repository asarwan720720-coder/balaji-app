<!DOCTYPE html>

      content="width=device-width, initial-scale=1.0">

<style>

*{

}

  margin:0;

<body>


<div class="header">
  My Commission
</div>


<div class="container">


  <!-- TOTAL COMMISSION -->

  <div class="total-box">

    <div class="total-title">
      Total Commission
    </div>

    <div
      class="total-amount"
      id="totalCommission"
    >
      ₹0
    </div>

  </div>


  <!-- REFERRAL INFO -->

  <div class="ref-box">

    <div class="ref-row">

      <span>
        My Referral Code
      </span>

      <span
        class="ref-code"
        id="myReferCode"
      >
        -
      </span>

    </div>


    <div class="ref-row">

      <span>
        Referred Users
      </span>

      <span
        class="count"
        id="userCount"
      >
        0
      </span>

    </div>

  </div>


  <!-- PLAY LIST -->

  <div id="userList">

    <div class="loading">
      Loading...
    </div>

  </div>


</div>



<script>


/* ================= SUPABASE ================= */

const SUPABASE_URL =
    "https://katbdbzoufiblnnsoxkk.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a";


const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* ================= GET CURRENT USER ================= */

function getCurrentUser(){

  const keys = [

    "user",
    "currentUser",
    "loginUser",
    "loggedUser"

  ];


  for(
    const key of keys
  ){

    const data =
      localStorage.getItem(key);


    if(!data){

      continue;

    }


    try{

      const user =
        JSON.parse(data);


      if(user){

        return user;

      }

    }
    catch(e){

      console.log(
        "LocalStorage parse error:",
        e
      );

    }

  }


  return null;

}



/* ================= LAST 4 MOBILE ================= */

function lastFourMobile(mobile){

  if(!mobile){

    return "****";

  }


  const value =
    String(mobile);


  if(value.length <= 4){

    return value;

  }


  return "****" +
    value.slice(-4);

}



/* ================= LOAD COMMISSION ================= */

async function loadCommission(){

  const userList =
    document.getElementById(
      "userList"
    );


  userList.innerHTML = `

    <div class="loading">
      Loading...
    </div>

  `;


  try{


    /* ================= CURRENT USER ================= */

    const myUser =
      getCurrentUser();


    if(!myUser){

      userList.innerHTML = `

        <div class="error">
          User login information not found.
        </div>

      `;

      return;

    }


    const currentId =
      myUser.id ||
      myUser.user_id ||
      myUser.userId;


    if(!currentId){

      userList.innerHTML = `

        <div class="error">
          User ID not found.
        </div>

      `;

      return;

    }



    /* ================= CURRENT USER ================= */

    const {
      data: currentUser,
      error: userError

    } = await client

      .from("login")

      .select(
        "id,name,mobile,refer_code,ref_by"
      )

      .eq(
        "id",
        currentId
      )

      .maybeSingle();



    if(userError){

      console.log(
        "CURRENT USER ERROR:",
        userError
      );

      throw userError;

    }



    if(!currentUser){

      userList.innerHTML = `

        <div class="error">
          Current user record not found.
        </div>

      `;

      return;

    }



    /* ================= MY REFER CODE ================= */

    const myReferCode =
      currentUser.refer_code;


    document.getElementById(
      "myReferCode"
    ).textContent =
      myReferCode || "-";



    if(!myReferCode){

      document.getElementById(
        "userCount"
      ).textContent =
        "0";


      userList.innerHTML = `

        <div class="empty">
          Your referral code is not available.
        </div>

      `;

      return;

    }



    /* ================= REFERRED USERS ================= */

    const {

      data: referredUsers,
      error: refError

    } = await client

      .from("login")

      .select(
        "id,name,mobile,refer_code,ref_by"
      )

      .eq(
        "ref_by",
        myReferCode
      )

      .order(
        "id",
        {
          ascending:false
        }
      );



    if(refError){

      console.log(
        "REFERRED USERS ERROR:",
        refError
      );

      throw refError;

    }



    console.log(
      "MY REFER CODE:",
      myReferCode
    );


    console.log(
      "REFERRED USERS:",
      referredUsers
    );



    /*
      Sirf wahi users count honge
      jinhone play kiya hai.
    */

    let playRows = [];



    /* ================= EACH REFERRED USER ================= */

    for(
      const referredUser
      of referredUsers || []
    ){


      /* ================= HISTORY ================= */

      const {

        data: history,
        error: historyError

      } = await client

        .from("history")

        .select(
          "id,user_id,total,market,created_at,status,commission,ref_by"
        )

        .eq(
          "user_id",
          String(referredUser.id)
        )

        .eq(
          "ref_by",
          myReferCode
        )

        .order(
          "created_at",
          {
            ascending:false
          }
        );



      if(historyError){

        console.log(
          "HISTORY ERROR:",
          historyError
        );

        continue;

      }



      /*
        Sirf play ki hui history
        rows list me add hongi.
      */

      if(
        history &&
        history.length > 0
      ){

        history.forEach(row => {

          playRows.push({

            name:
              referredUser.name ||
              "Customer",

            mobile:
              referredUser.mobile ||
              "",

            market:
              row.market ||
              "-",

            commission:
              Number(row.commission) || 0,

            created_at:
              row.created_at

          });

        });

      }

    }



    /* ================= COUNT ================= */

    const uniqueUsers =
      new Set(
        playRows.map(
          row =>
            row.name +
            "|" +
            row.mobile
        )
      );


    document.getElementById(
      "userCount"
    ).textContent =
      uniqueUsers.size;



    /* ================= EMPTY ================= */

    if(
      playRows.length === 0
    ){

      document.getElementById(
        "totalCommission"
      ).textContent =
        "₹0";


      userList.innerHTML = `

        <div class="empty">
          Abhi kisi referred user ne play nahi kiya.
        </div>

      `;

      return;

    }



    /* ================= TOTAL ================= */

    let totalCommission = 0;


    playRows.forEach(row => {

      totalCommission +=
        Number(row.commission) || 0;

    });



    document.getElementById(
      "totalCommission"
    ).textContent =
      "₹" + totalCommission;



    /* ================= ROWS ================= */

    let html = "";


    playRows.forEach(row => {


      const mobile =
        lastFourMobile(
          row.mobile
        );


      html += `

        <div class="play-row">

          <div class="play-top">


            <div class="user-info">

              <div class="user-name">
                ${row.name}
              </div>

              <div class="user-mobile">
                ${mobile}
              </div>

            </div>


            <div class="market">
              ${row.market}
            </div>


            <div class="commission">
              ₹${row.commission}
            </div>


          </div>

        </div>

      `;

    });



    userList.innerHTML =
      html;


  }
  catch(error){


    console.log(
      "COMMISSION PAGE ERROR:",
      error
    );


    userList.innerHTML = `

      <div class="error">

        Commission data load nahi ho raha.

        <br><br>

        ${error.message || error}

      </div>

    `;

  }

}



/* ================= START ================= */

loadCommission();


</script>


</body>

</html>
