<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wining</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  color: #222;
}

.header {
  background: #111827;
  color: white;
  padding: 18px 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.container {
  width: 100%;
  max-width: 650px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 14px;
  margin-bottom: 12px;
  padding: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.market {
  text-align: center;
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 12px;
  color: #111827;
}

.info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

.info:last-child {
  border-bottom: none;
}

.label {
  color: #777;
}

.value {
  font-weight: bold;
}

.win-amount {
  font-size: 21px;
  color: #15803d;
}

.status {
  display: inline-block;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

.pending {
  background: #fff3cd;
  color: #856404;
}

.accepted {
  background: #d1fae5;
  color: #047857;
}

.cancelled {
  background: #fee2e2;
  color: #b91c1c;
}

.empty {
  background: white;
  border-radius: 14px;
  text-align: center;
  padding: 35px 15px;
  color: #777;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.loading {
  text-align: center;
  padding: 30px;
  color: #777;
}

.refresh {
  display: block;
  margin: 0 auto 15px;
  padding: 9px 18px;
  border: none;
  border-radius: 20px;
  background: #111827;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="header">
  🏆 Wining
</div>

<div class="container">

  <button class="refresh" onclick="loadWining()">
    Refresh
  </button>

  <div id="winingList">
    <div class="loading">
      Wining load ho rahi hai...
    </div>
  </div>

</div>

<script>

/* ================= SUPABASE ================= */

const supabaseClient = supabase.createClient(
  "https://katbdbzoufiblnnsoxkk.supabase.co",
  "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"
);


/* ================= USER ID ================= */

/*
  Yahan login ke baad saved user_id li ja rahi hai.
*/

const userId = localStorage.getItem("user_id");


/* ================= LOAD WINING ================= */

async function loadWining() {

  const list = document.getElementById("winingList");

  list.innerHTML = `
    <div class="loading">
      Wining load ho rahi hai...
    </div>
  `;

  if (!userId) {

    list.innerHTML = `
      <div class="empty">
        <div style="font-size:40px;">🔒</div>
        <br>
        User login nahi hai.
      </div>
    `;

    return;
  }


  const { data, error } = await supabaseClient
    .from("wining")
    .select("*")
    .eq("user_id", String(userId))
    .order("created_at", { ascending: false });


  if (error) {

    console.error(error);

    list.innerHTML = `
      <div class="empty">
        Wining load nahi ho saki.
      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    list.innerHTML = `
      <div class="empty">
        <div style="font-size:45px;">🏆</div>
        <br>
        Abhi koi winning nahi hai.
      </div>
    `;

    return;
  }


  list.innerHTML = "";


  data.forEach(row => {

    let statusText = "Pending";
    let statusClass = "pending";

    if (row.status === "accepted") {
      statusText = "Accepted";
      statusClass = "accepted";
    }

    if (row.status === "cancelled") {
      statusText = "Cancelled";
      statusClass = "cancelled";
    }


    let createdDate = "";

    if (row.created_at) {

      createdDate = new Date(row.created_at).toLocaleString(
        "en-IN",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <div class="market">
        ${escapeHtml(row.market || "Market")}
      </div>

      <div class="info">
        <span class="label">Number</span>
        <span class="value">
          ${escapeHtml(row.number || "-")}
        </span>
      </div>

      <div class="info">
        <span class="label">Bet Amount</span>
        <span class="value">
          ₹${Number(row.bet_amount || 0)}
        </span>
      </div>

      <div class="info">
        <span class="label">Winning Amount</span>
        <span class="value win-amount">
          ₹${Number(row.amount || 0)}
        </span>
      </div>

      <div class="info">
        <span class="label">Game</span>
        <span class="value">
          ${escapeHtml(row.game_type || "-")}
        </span>
      </div>

      <div class="info">
        <span class="label">Status</span>
        <span class="status ${statusClass}">
          ${statusText}
        </span>
      </div>

      ${
        createdDate
        ? `
        <div class="info">
          <span class="label">Date</span>
          <span class="value">
            ${createdDate}
          </span>
        </div>
        `
        : ""
      }

    `;

    list.appendChild(card);

  });

}


/* ================= SECURITY ================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ================= START ================= */

loadWining();

</script>

</body>
</html>
