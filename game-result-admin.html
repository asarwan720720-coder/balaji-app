<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Game Result Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f5f9;
    color:#222;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.header{
    background:#111827;
    color:white;
    padding:18px;
    border-radius:14px;
    margin-bottom:18px;
}

.header h1{
    margin:0 0 6px;
    font-size:23px;
}

.header p{
    margin:0;
    color:#cbd5e1;
    font-size:14px;
}

/* ADD MARKET */

.add-box{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.section-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.field label{
    font-size:13px;
    font-weight:bold;
    color:#555;
}

input{
    width:100%;
    min-height:44px;
    padding:10px 12px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    outline:none;
    background:white;
}

input:focus{
    border-color:#2563eb;
}

.add-btn{
    width:100%;
    min-height:46px;
    margin-top:14px;
    border:0;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

/* STATUS */

.status{
    min-height:20px;
    margin:10px 0;
    font-size:14px;
    font-weight:bold;
}

/* MARKET */

.market-list{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.market-card{
    background:white;
    border-radius:14px;
    padding:17px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.market-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.market-title{
    font-size:19px;
    font-weight:bold;
}

.market-id{
    font-size:12px;
    color:#777;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.result-box{
    border:2px solid #16a34a;
    border-radius:10px;
    padding:12px;
    background:#f0fdf4;
}

.result-box label{
    display:block;
    font-size:12px;
    font-weight:bold;
    color:#166534;
    margin-bottom:6px;
}

.result-input{
    border:0;
    background:transparent;
    font-size:20px;
    font-weight:bold;
    padding:4px 0;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.update-btn,
.delete-btn{
    min-height:44px;
    border:0;
    border-radius:9px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.update-btn{
    background:#16a34a;
    color:white;
}

.delete-btn{
    background:#dc2626;
    color:white;
}

.kal-box{
    margin-top:12px;
    padding:10px 12px;
    background:#f8fafc;
    border-radius:8px;
    font-size:14px;
}

.empty{
    text-align:center;
    background:white;
    padding:30px;
    border-radius:14px;
    color:#777;
}

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .form-grid,
    .grid{
        grid-template-columns:1fr;
    }

    .market-top{
        align-items:flex-start;
        flex-direction:column;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Game Result Admin</h1>
        <p>Market add, edit, result update aur delete</p>
    </div>


    <!-- ADD MARKET -->

    <div class="add-box">

        <div class="section-title">
            ➕ New Market
        </div>

        <div class="form-grid">

            <div class="field">
                <label>Market Name</label>
                <input
                    type="text"
                    id="newName"
                    placeholder="Gaziabad">
            </div>

            <div class="field">
                <label>Result</label>
                <input
                    type="text"
                    id="newNumber"
                    value="**"
                    placeholder="**">
            </div>

            <div class="field">
                <label>Open Time</label>
                <input
                    type="time"
                    id="newOpen">
            </div>

            <div class="field">
                <label>Close Time</label>
                <input
                    type="time"
                    id="newClose">
            </div>

            <div class="field">
                <label>Close 2 Time</label>
                <input
                    type="time"
                    id="newClose2">
            </div>

            <div class="field">
                <label>Date</label>
                <input
                    type="date"
                    id="newDate">
            </div>

        </div>

        <button
            type="button"
            class="add-btn"
            id="addMarketBtn">
            ADD MARKET
        </button>

        <div
            id="status"
            class="status">
        </div>

    </div>


    <!-- MARKET LIST -->

    <div class="section-title">
        📋 All Markets
    </div>

    <div
        id="marketList"
        class="market-list">
    </div>

</div>


<script>

const TABLE_NAME = "Game result";

const statusBox =
    document.getElementById("status");

const marketList =
    document.getElementById("marketList");


/*
    SUPABASE

    supabase.js me ye hona chahiye:

    const SUPABASE_URL = "...";
    const SUPABASE_ANON_KEY = "...";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );
*/

const db =
    window.supabaseClient;


/* --------------------------------
   STATUS
-------------------------------- */

function showStatus(message, success = true){

    statusBox.textContent = message;

    statusBox.style.color =
        success ? "#15803d" : "#dc2626";

    setTimeout(() => {
        statusBox.textContent = "";
    }, 3500);
}


/* --------------------------------
   DATE
-------------------------------- */

function todayString(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth() + 1)
        .padStart(2,"0");

    const day =
        String(now.getDate())
        .padStart(2,"0");

    return `${year}-${month}-${day}`;
}


/* --------------------------------
   LOAD MARKETS
-------------------------------- */

async function loadMarkets(){

    marketList.innerHTML =
        `<div class="empty">Loading...</div>`;

    const { data, error } =
        await db
            .from(TABLE_NAME)
            .select("*")
            .order("id", {
                ascending:true
            });

    if(error){

        console.error(error);

        marketList.innerHTML =
            `<div class="empty">
                Data load nahi hua.<br>
                ${error.message}
             </div>`;

        return;
    }

    if(!data || data.length === 0){

        marketList.innerHTML =
            `<div class="empty">
                Koi market nahi hai.
             </div>`;

        return;
    }

    /*
       Daily automatic system
    */

    await checkDailyReset(data);

    /*
       Reset ke baad fresh data
    */

    const { data: freshData } =
        await db
            .from(TABLE_NAME)
            .select("*")
            .order("id", {
                ascending:true
            });

    renderMarkets(freshData || data);
}


/* --------------------------------
   DAILY RESET
-------------------------------- */

async function checkDailyReset(markets){

    const today =
        todayString();

    for(const market of markets){

        /*
          Date NULL hai to usko
          aaj ki date set kar denge.
        */

        if(!market.date){

            const { error } =
                await db
                    .from(TABLE_NAME)
                    .update({
                        date: today
                    })
                    .eq("id", market.id);

            if(error){
                console.error(
                    "Date update error:",
                    error
                );
            }

            continue;
        }


        /*
          Agar stored date purani hai,
          current result -> kal
          current result -> **
        */

        if(market.date !== today){

            let previousResult =
                market.number;

            /*
              Agar already ** hai,
              to kal me ** save nahi karenge.
            */

            if(
                previousResult !== null &&
                previousResult !== undefined &&
                previousResult !== "" &&
                previousResult !== "**"
            ){

                const { error } =
                    await db
                        .from(TABLE_NAME)
                        .update({

                            kal: previousResult,

                            number: "**",

                            date: today

                        })
                        .eq("id", market.id);

                if(error){

                    console.error(
                        "Daily reset error:",
                        error
                    );

                }

            }else{

                const { error } =
                    await db
                        .from(TABLE_NAME)
                        .update({

                            number: "**",

                            date: today

                        })
                        .eq("id", market.id);

                if(error){

                    console.error(
                        "Daily reset error:",
                        error
                    );

                }

            }

        }

    }

}


/* --------------------------------
   RENDER
-------------------------------- */

function renderMarkets(markets){

    marketList.innerHTML = "";

    markets.forEach(market => {

        const card =
            document.createElement("div");

        card.className =
            "market-card";

        card.innerHTML = `

            <div class="market-top">

                <div>
                    <div class="market-title">
                        ${escapeHtml(
                            market.name || ""
                        )}
                    </div>

                    <div class="market-id">
                        ID: ${market.id}
                    </div>
                </div>

            </div>


            <div class="grid">

                <div class="field">

                    <label>Market Name</label>

                    <input
                        type="text"
                        class="name-input"
                        value="${escapeAttr(
                            market.name || ""
                        )}">

                </div>


                <div class="result-box">

                    <label>Result / Number</label>

                    <input
                        type="text"
                        class="result-input"
                        value="${escapeAttr(
                            market.number || "**"
                        )}">

                </div>


                <div class="field">

                    <label>Open Time</label>

                    <input
                        type="time"
                        class="open-input"
                        value="${formatTime(
                            market.open
                        )}">

                </div>


                <div class="field">

                    <label>Close Time</label>

                    <input
                        type="time"
                        class="close-input"
                        value="${formatTime(
                            market.close
                        )}">

                </div>


                <div class="field">

                    <label>Close 2 Time</label>

                    <input
                        type="time"
                        class="close2-input"
                        value="${formatTime(
                            market.close2
                        )}">

                </div>


                <div class="field">

                    <label>Date</label>

                    <input
                        type="date"
                        class="date-input"
                        value="${market.date || ""}">

                </div>

            </div>


            <div class="kal-box">

                <strong>Kal ka Result:</strong>

                ${
                    market.kal
                    ? escapeHtml(market.kal)
                    : "--"
                }

            </div>


            <div class="buttons">

                <button
                    type="button"
                    class="update-btn">
                    UPDATE
                </button>

                <button
                    type="button"
                    class="delete-btn">
                    DELETE
                </button>

            </div>

        `;


        /*
          UPDATE
        */

        card
            .querySelector(".update-btn")
            .addEventListener(
                "click",
                async () => {

                    await updateMarket(
                        market.id,
                        card
                    );

                }
            );


        /*
          DELETE
        */

        card
            .querySelector(".delete-btn")
            .addEventListener(
                "click",
                async () => {

                    await deleteMarket(
                        market.id,
                        market.name
                    );

                }
            );


        marketList.appendChild(card);

    });

}


/* --------------------------------
   UPDATE MARKET
-------------------------------- */

async function updateMarket(id, card){

    const name =
        card
            .querySelector(".name-input")
            .value
            .trim();

    const number =
        card
            .querySelector(".result-input")
            .value
            .trim();

    const open =
        card
            .querySelector(".open-input")
            .value || null;

    const close =
        card
            .querySelector(".close-input")
            .value || null;

    const close2 =
        card
            .querySelector(".close2-input")
            .value || null;

    const date =
        card
            .querySelector(".date-input")
            .value || null;


    if(!name){

        alert("Market name bharo.");

        return;
    }


    if(!number){

        alert("Result bharo.");

        return;
    }


    const { error } =
        await db
            .from(TABLE_NAME)
            .update({

                name: name,

                number: number,

                open: open,

                close: close,

                close2: close2,

                date: date

            })
            .eq("id", id);


    if(error){

        console.error(error);

        alert(
            "Update failed:\n" +
            error.message
        );

        return;
    }


    alert("Market successfully update ho gaya.");

    await loadMarkets();

}


/* --------------------------------
   DELETE MARKET
-------------------------------- */

async function deleteMarket(id, name){

    const confirmDelete =
        confirm(
            `"${name}" market delete karna hai?`
        );

    if(!confirmDelete){

        return;
    }


    const { error } =
        await db
            .from(TABLE_NAME)
            .delete()
            .eq("id", id);


    if(error){

        console.error(error);

        alert(
            "Delete failed:\n" +
            error.message
        );

        return;
    }


    alert("Market delete ho gaya.");

    await loadMarkets();

}


/* --------------------------------
   ADD MARKET
-------------------------------- */

document
    .getElementById("addMarketBtn")
    .addEventListener(
        "click",
        async () => {

            const name =
                document
                    .getElementById("newName")
                    .value
                    .trim();

            const number =
                document
                    .getElementById("newNumber")
                    .value
                    .trim() || "**";

            const open =
                document
                    .getElementById("newOpen")
                    .value || null;

            const close =
                document
                    .getElementById("newClose")
                    .value || null;

            const close2 =
                document
                    .getElementById("newClose2")
                    .value || null;

            const date =
                document
                    .getElementById("newDate")
                    .value ||
                    todayString();


            if(!name){

                showStatus(
                    "Market name bharo.",
                    false
                );

                return;
            }


            const { error } =
                await db
                    .from(TABLE_NAME)
                    .insert({

                        name: name,

                        number: number,

                        open: open,

                        close: close,

                        close2: close2,

                        date: date,

                        kal: null

                    });


            if(error){

                console.error(error);

                showStatus(
                    "Market add nahi hua: " +
                    error.message,
                    false
                );

                return;
            }


            showStatus(
                "New market successfully add ho gaya."
            );


            document
                .getElementById("newName")
                .value = "";

            document
                .getElementById("newNumber")
                .value = "**";

            document
                .getElementById("newOpen")
                .value = "";

            document
                .getElementById("newClose")
                .value = "";

            document
                .getElementById("newClose2")
                .value = "";

            document
                .getElementById("newDate")
                .value =
                    todayString();


            await loadMarkets();

        }
    );


/* --------------------------------
   TIME FORMAT
-------------------------------- */

function formatTime(value){

    if(!value){
        return "";
    }

    /*
      Supabase:
      06:00:00

      Input:
      06:00
    */

    return value.substring(0,5);

}


/* --------------------------------
   HTML SAFETY
-------------------------------- */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttr(value){

    return escapeHtml(value);

}


/* --------------------------------
   START
-------------------------------- */

document
    .getElementById("newDate")
    .value =
        todayString();


if(!db){

    marketList.innerHTML =
        `<div class="empty">
            Supabase connection nahi mili.<br><br>
            <strong>supabase.js</strong>
            check karo.
         </div>`;

}else{

    loadMarkets();

}


/*
  Page khuli rahe to har 1 minute
  daily reset check hoga.

  Page band ho aur next day khule,
  tab bhi loadMarkets() reset kar dega.
*/

setInterval(
    async () => {

        if(db){

            await loadMarkets();

        }

    },
    60 * 1000
);

</script>

</body>
</html>
