<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Make Payment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fff7e6,#ffe0b2);
  min-height:100vh;
  padding:20px 12px;
}

.container{
  width:100%;
  max-width:500px;
  margin:auto;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.title{
  text-align:center;
  font-size:24px;
  font-weight:bold;
  color:#222;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:20px;
}

.amountBox{
  text-align:center;
  background:#fff8e1;
  border:1px solid #ffe082;
  border-radius:12px;
  padding:15px;
  margin-bottom:20px;
}

.amountLabel{
  font-size:13px;
  color:#777;
}

.amount{
  font-size:30px;
  font-weight:bold;
  color:#e65100;
  margin-top:5px;
}

.qrBox{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
  min-height:270px;
}

#qrcode{
  display:flex;
  justify-content:center;
  align-items:center;
}

#qrcode img,
#qrcode canvas{
  width:240px !important;
  height:240px !important;
}

.upiBox{
  background:#f5f5f5;
  border-radius:10px;
  padding:13px;
  text-align:center;
  margin-bottom:20px;
}

.upiLabel{
  font-size:13px;
  color:#777;
  margin-bottom:5px;
}

.upiId{
  font-size:17px;
  font-weight:bold;
  word-break:break-all;
}

.instruction{
  text-align:center;
  color:#555;
  font-size:14px;
  line-height:1.5;
  margin-bottom:20px;
}

.label{
  font-size:15px;
  font-weight:bold;
  color:#444;
  margin-bottom:8px;
}

.utrInput{
  width:100%;
  height:52px;
  border:1px solid #ddd;
  border-radius:10px;
  padding:0 14px;
  font-size:17px;
  outline:none;
}

.utrInput:focus{
  border-color:#ff9800;
}

.submitBtn{
  width:100%;
  height:52px;
  margin-top:15px;
  border:0;
  border-radius:11px;
  background:#ff9800;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.submitBtn:disabled{
  background:#aaa;
}

.errorBox{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  background:#ffebee;
  color:#c62828;
  font-size:14px;
  line-height:1.5;
  word-break:break-word;
}

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}

</style>

</head>


<body>

<div class="container">

  <div class="card">

    <div class="title">
      Complete Payment
    </div>

    <div class="subtitle">
      Scan QR Code and make payment
    </div>


    <div
      id="loading"
      class="loading">

      Loading...

    </div>


    <div
      id="paymentContent"
      style="display:none;">


      <div class="amountBox">

        <div class="amountLabel">
          Pay Amount
        </div>

        <div
          id="amount"
          class="amount">

          ₹0

        </div>

      </div>


      <div class="qrBox">

        <div id="qrcode"></div>

      </div>


      <div class="upiBox">

        <div class="upiLabel">
          Payment UPI ID
        </div>

        <div class="upiId">
          7KW0568000@mairtel
        </div>

      </div>


      <div class="instruction">

        QR scan karke payment karein.
        <br>
        Payment ke baad User ID niche enter karein.

      </div>


      <div class="label">
        Enter User ID
      </div>


      <input
        id="utr"
        class="utrInput"
        type="text"
        autocomplete="off"
        placeholder="Enter User ID"
      >


      <button
        id="submitBtn"
        class="submitBtn"
        type="button"
        onclick="submitUTR()">

        Submit User ID

      </button>


      <div
        id="errorBox"
        class="errorBox">
      </div>

    </div>

  </div>

</div>


<script>


// ========================================
// SUPABASE
// ========================================

const SUPABASE_URL =
"https://glhomrlwnwhevunfubog.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VihOz3hSXZzUiI9eANDL0A_EtaD-KIB";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// ========================================
// USER ID
// ========================================

const userId =
localStorage.getItem("user_id");


// ========================================
// AMOUNT
// ========================================

const params =
new URLSearchParams(
  window.location.search
);


const amountFromPage =
Number(
  params.get("amount")
);


// ========================================
// CURRENT REQUEST
// ========================================

let currentRequest = null;


// ========================================
// ERROR
// ========================================

function showError(message){

  const box =
  document.getElementById(
    "errorBox"
  );

  box.innerText =
  message;

  box.style.display =
  "block";

}


function hideError(){

  const box =
  document.getElementById(
    "errorBox"
  );

  box.innerText =
  "";

  box.style.display =
  "none";

}


// ========================================
// HIDE LOADING
// ========================================

function hideLoading(){

  document.getElementById(
    "loading"
  ).style.display =
  "none";

}


// ========================================
// SHOW PAYMENT
// ========================================

function showPayment(){

  document.getElementById(
    "paymentContent"
  ).style.display =
  "block";

}


// ========================================
// LOAD REQUEST
// ========================================

async function loadRequest(){

  try{


    console.log(
      "========== DEPOSIT PAYMENT =========="
    );

    console.log(
      "User ID:",
      userId
    );

    console.log(
      "Amount:",
      amountFromPage
    );


    // ==================================
    // USER CHECK
    // ==================================

    if(!userId){

      throw new Error(
        "User login nahi mila. localStorage me user_id nahi hai."
      );

    }


    // ==================================
    // AMOUNT CHECK
    // ==================================

    if(
      !amountFromPage ||
      amountFromPage <= 0
    ){

      throw new Error(
        "Amount nahi mila."
      );

    }


    // ==================================
    // 1. PENDING REQUESTS GET
    //
    // created_at ka filter Supabase
    // me nahi lagaya.
    // ==================================

    console.log(
      "Pending request check..."
    );


    const {
      data: pendingRequests,
      error: pendingError
    } =
    await supabaseClient

      .from("deposit_requests")

      .select(
        "id,user_id,amount,status,utr,created_at"
      )

      .eq(
        "user_id",
        Number(userId)
      )

      .eq(
        "amount",
        Number(amountFromPage)
      )

      .eq(
        "status",
        "pending"
      )

      .order(
        "created_at",
        {
          ascending:false
        }
      )

      .limit(10);


    if(pendingError){

      console.error(
        "PENDING REQUEST ERROR:",
        pendingError
      );

      throw new Error(
        "Supabase error: " +
        pendingError.message +
        " | Code: " +
        (pendingError.code || "unknown")
      );

    }


    console.log(
      "Pending requests:",
      pendingRequests
    );


    // ==================================
    // 2. 5 MINUTE REQUEST FIND
    // Browser side par check
    // ==================================

    const fiveMinutes =
    5 * 60 * 1000;


    const now =
    Date.now();


    let existingRequest =
    null;


    if(
      pendingRequests &&
      pendingRequests.length > 0
    ){

      for(
        let i = 0;
        i < pendingRequests.length;
        i++
      ){

        const row =
        pendingRequests[i];


        const createdTime =
        new Date(
          row.created_at
        ).getTime();


        const age =
        now - createdTime;


        if(
          !isNaN(createdTime) &&
          age >= 0 &&
          age <= fiveMinutes
        ){

          existingRequest =
          row;

          break;

        }

      }

    }


    // ==================================
    // 3. EXISTING REQUEST
    // ==================================

    if(existingRequest){

      console.log(
        "Existing 5 minute request:",
        existingRequest
      );


      currentRequest =
      existingRequest;

    }


    // ==================================
    // 4. NEW REQUEST
    // ==================================

    else{

      console.log(
        "Creating NEW deposit request..."
      );


      const {
        data: newRequest,
        error: insertError
      } =
      await supabaseClient

        .from("deposit_requests")

        .insert({

          user_id:
          Number(userId),

          amount:
          Number(amountFromPage),

          status:
          "pending"

        })

        .select(
          "id,user_id,amount,status,utr,created_at"
        )

        .single();


      if(insertError){

        console.error(
          "INSERT ERROR:",
          insertError
        );

        throw new Error(
          "Deposit request create nahi hui: " +
          insertError.message +
          " | Code: " +
          (insertError.code || "unknown")
        );

      }


      if(!newRequest){

        throw new Error(
          "Supabase ne new request return nahi ki."
        );

      }


      currentRequest =
      newRequest;


      console.log(
        "New request:",
        currentRequest
      );

    }


    // ==================================
    // STATUS CHECK
    // ==================================

    if(
      currentRequest.status !==
      "pending"
    ){

      throw new Error(
        "Ye deposit request pending nahi hai."
      );

    }


    // ==================================
    // AMOUNT DISPLAY
    // ==================================

    const amount =
    Number(
      currentRequest.amount
    );


    document.getElementById(
      "amount"
    ).innerText =
    "₹" +
    amount.toFixed(2);


    // ==================================
    // UPI
    // ==================================

    const upiId =
    "7KW0568000@mairtel";


    const upiData =
    "upi://pay" +
    "?pa=" +
    encodeURIComponent(
      upiId
    ) +
    "&am=" +
    encodeURIComponent(
      amount.toFixed(2)
    ) +
    "&cu=INR";


    console.log(
      "UPI DATA:",
      upiData
    );


    // ==================================
    // QR
    // ==================================

    const qrBox =
    document.getElementById(
      "qrcode"
    );


    qrBox.innerHTML =
    "";


    if(
      typeof QRCode ===
      "undefined"
    ){

      throw new Error(
        "QRCode library load nahi hui."
      );

    }


    new QRCode(
      qrBox,
      {
        text:
        upiData,

        width:
        240,

        height:
        240,

        correctLevel:
        QRCode.CorrectLevel.M
      }
    );


    // ==================================
    // SHOW PAGE
    // ==================================

    hideLoading();

    showPayment();


    console.log(
      "QR CREATED SUCCESSFULLY"
    );


  }
  catch(error){

    console.error(
      "LOAD REQUEST FINAL ERROR:",
      error
    );


    hideLoading();


    showError(
      error.message ||
      "Kuch error aa gaya."
    );

  }

}


// ========================================
// SUBMIT USER ID
// ========================================

async function submitUTR(){

  try{

    hideError();


    const utrInput =
    document.getElementById(
      "utr"
    );


    const submitBtn =
    document.getElementById(
      "submitBtn"
    );


    const utr =
    utrInput.value;


    if(!currentRequest){

      showError(
        "Deposit request nahi mili."
      );

      return;

    }


    submitBtn.disabled =
    true;

    submitBtn.innerText =
    "Submitting...";


    console.log(
      "Updating request:",
      currentRequest.id
    );


    const {
      error: updateError
    } =
    await supabaseClient

      .from("deposit_requests")

      .update({

        utr:
        utr,

        updated_at:
        new Date().toISOString()

      })

      .eq(
        "id",
        currentRequest.id
      )

      .eq(
        "user_id",
        Number(userId)
      );


    if(updateError){

      console.error(
        "UPDATE ERROR:",
        updateError
      );

      throw new Error(
        "User ID submit nahi hua: " +
        updateError.message
      );

    }


    window.location.replace(
      "deposit.html"
    );


  }
  catch(error){

    console.error(
      "SUBMIT ERROR:",
      error
    );


    showError(
      error.message ||
      "User ID submit nahi hua."
    );


    const submitBtn =
    document.getElementById(
      "submitBtn"
    );


    submitBtn.disabled =
    false;

    submitBtn.innerText =
    "Submit User ID";

  }

}


// ========================================
// START
// ========================================

loadRequest();


</script>

</body>

</html>
