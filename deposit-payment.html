<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Make Payment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    width: 100%;
    max-width: 450px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h2 {
    text-align: center;
    margin-top: 0;
}

.amount {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin: 15px 0;
}

.upi {
    text-align: center;
    background: #f1f1f1;
    padding: 10px;
    border-radius: 8px;
    word-break: break-all;
}

#qrcode {
    width: 250px;
    min-height: 250px;
    margin: 20px auto;
    display: flex;
    justify-content: center;
    align-items: center;
}

#qrcode img {
    width: 240px;
    height: 240px;
    display: block;
}

.loading {
    text-align: center;
    color: #666;
}

.error {
    color: red;
    text-align: center;
    line-height: 1.5;
}

.success {
    color: green;
    text-align: center;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    margin-top: 8px;
}

button {
    width: 100%;
    border: none;
    padding: 14px;
    margin-top: 12px;
    border-radius: 8px;
    background: #1976d2;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    background: #aaa;
}

.note {
    font-size: 13px;
    color: #666;
    margin-top: 15px;
    line-height: 1.5;
    text-align: center;
}

</style>

</head>


<body>

<div class="container">

    <div class="card">

        <h2>Make Payment</h2>

        <div id="loading" class="loading">
            Loading...
        </div>

        <div id="paymentBox" style="display:none;">

            <div class="amount">
                ₹<span id="amountText">0</span>
            </div>

            <div class="upi">
                UPI ID:<br>
                <strong id="upiText">7KW0568000@mairtel</strong>
            </div>

            <div id="qrcode"></div>

            <div>
                <label>Enter UTR / Transaction ID</label>

                <input
                    type="text"
                    id="utr"
                    placeholder="Enter UTR number"
                    autocomplete="off"
                >

                <button id="submitBtn">
                    Submit Payment
                </button>
            </div>

            <div class="note">
                Payment karne ke baad apna UTR / Transaction ID
                enter karke Submit karein.
            </div>

            <div id="message"></div>

        </div>

    </div>

</div>


<script>

// ===============================
// SUPABASE
// ===============================

const SUPABASE_URL =
    "https://glhomrlwnwhevunfubog.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VihOz3hSXZzUi9EandL0A_EtaD-KIB";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ===============================
// UPI DETAILS
// ===============================

const UPI_ID = "7KW0568000@mairtel";


// ===============================
// URL AMOUNT
// ===============================

const params = new URLSearchParams(
    window.location.search
);

const amountFromPage = Number(
    params.get("amount")
);


// ===============================
// USER ID
// ===============================

const userId =
    localStorage.getItem("user_id");


// ===============================
// ELEMENTS
// ===============================

const loading =
    document.getElementById("loading");

const paymentBox =
    document.getElementById("paymentBox");

const amountText =
    document.getElementById("amountText");

const upiText =
    document.getElementById("upiText");

const qrBox =
    document.getElementById("qrcode");

const utrInput =
    document.getElementById("utr");

const submitBtn =
    document.getElementById("submitBtn");

const message =
    document.getElementById("message");


// ===============================
// START
// ===============================

window.addEventListener("load", function() {

    loadRequest();

});


// ===============================
// LOAD / CREATE REQUEST
// ===============================

async function loadRequest() {

    try {

        console.log("User ID:", userId);

        console.log(
            "Amount:",
            amountFromPage
        );


        // USER ID CHECK

        if (!userId) {

            throw new Error(
                "User ID localStorage me nahi mila."
            );

        }


        // AMOUNT CHECK

        if (
            !amountFromPage ||
            amountFromPage < 100
        ) {

            throw new Error(
                "Invalid amount."
            );

        }


        // SHOW BASIC DETAILS

        amountText.textContent =
            amountFromPage;

        upiText.textContent =
            UPI_ID;


        // ===============================
        // 5 MINUTE TIME
        // ===============================

        const fiveMinutesAgo =
            new Date(
                Date.now() - 5 * 60 * 1000
            ).toISOString();


        console.log(
            "Checking existing request..."
        );


        // ===============================
        // FIND EXISTING REQUEST
        // ===============================

        const {
            data: existing,
            error: findError
        } = await supabase

            .from("deposit_requests")

            .select(
                "id,user_id,amount,utr,status,created_at"
            )

            .eq(
                "user_id",
                Number(userId)
            )

            .eq(
                "amount",
                Number(amountFromPage)
            )

            .eq(
                "status",
                "pending"
            )

            .gte(
                "created_at",
                fiveMinutesAgo
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            )

            .limit(1);


        // ===============================
        // FIND ERROR
        // ===============================

        if (findError) {

            console.error(
                "Find request error:",
                findError
            );

            throw new Error(
                "Deposit request check failed: " +
                findError.message
            );

        }


        let request;


        // ===============================
        // EXISTING REQUEST
        // ===============================

        if (
            existing &&
            existing.length > 0
        ) {

            request =
                existing[0];

            console.log(
                "Existing request:",
                request
            );

        }


        // ===============================
        // CREATE NEW REQUEST
        // ===============================

        else {

            console.log(
                "Creating new request..."
            );


            const {
                data: newRequest,
                error: insertError
            } = await supabase

                .from("deposit_requests")

                .insert({

                    user_id:
                        Number(userId),

                    amount:
                        Number(amountFromPage),

                    status:
                        "pending"

                })

                .select(
                    "id,user_id,amount,utr,status,created_at"
                )

                .single();


            // ===============================
            // INSERT ERROR
            // ===============================

            if (insertError) {

                console.error(
                    "Insert request error:",
                    insertError
                );

                throw new Error(
                    "Deposit request create failed: " +
                    insertError.message
                );

            }


            request =
                newRequest;


            console.log(
                "New request:",
                request
            );

        }


        // ===============================
        // CREATE QR
        // ===============================

        createQR();


        // ===============================
        // SHOW PAYMENT BOX
        // ===============================

        loading.style.display =
            "none";

        paymentBox.style.display =
            "block";


        // Existing UTR show karo
        if (request.utr) {

            utrInput.value =
                request.utr;

        }


    }

    catch (error) {

        console.error(
            "loadRequest ERROR:",
            error
        );


        loading.innerHTML = `
            <div class="error">
                <strong>Something went wrong</strong>
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

    }

}


// ===============================
// CREATE QR
// ===============================

function createQR() {

    try {

        qrBox.innerHTML = "";

        const upiUrl =
            "upi://pay" +
            "?pa=" +
            encodeURIComponent(UPI_ID) +
            "&am=" +
            encodeURIComponent(
                amountFromPage.toFixed(2)
            ) +
            "&cu=INR";


        console.log(
            "UPI URL:",
            upiUrl
        );


        const qrImage =
            document.createElement("img");


        qrImage.alt =
            "UPI Payment QR";


        qrImage.width = 240;

        qrImage.height = 240;


        qrImage.src =
            "https://api.qrserver.com/v1/create-qr-code/" +
            "?size=240x240&data=" +
            encodeURIComponent(upiUrl);


        qrImage.onload =
            function() {

                console.log(
                    "QR loaded successfully"
                );

            };


        qrImage.onerror =
            function() {

                console.error(
                    "QR image failed to load"
                );

                qrBox.innerHTML = `
                    <div class="error">
                        QR image load nahi ho rahi.
                    </div>
                `;

            };


        qrBox.appendChild(
            qrImage
        );

    }

    catch (error) {

        console.error(
            "QR ERROR:",
            error
        );

        qrBox.innerHTML = `
            <div class="error">
                QR generate nahi ho paya.
            </div>
        `;

    }

}


// ===============================
// SUBMIT UTR
// ===============================

submitBtn.addEventListener(
    "click",
    submitUTR
);


async function submitUTR() {

    try {

        const utr =
            utrInput.value.trim();


        if (!utr) {

            message.innerHTML = `
                <div class="error">
                    UTR / Transaction ID enter karein.
                </div>
            `;

            return;

        }


        submitBtn.disabled =
            true;

        submitBtn.textContent =
            "Submitting...";


        // Latest pending request
        const {
            data: request,
            error: requestError
        } = await supabase

            .from("deposit_requests")

            .select(
                "id,status,created_at"
            )

            .eq(
                "user_id",
                Number(userId)
            )

            .eq(
                "amount",
                Number(amountFromPage)
            )

            .eq(
                "status",
                "pending"
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            )

            .limit(1)
            .maybeSingle();


        if (requestError) {

            console.error(
                "Request find error:",
                requestError
            );

            throw new Error(
                requestError.message
            );

        }


        if (!request) {

            throw new Error(
                "Pending deposit request nahi mili."
            );

        }


        // ===============================
        // UPDATE UTR
        // ===============================

        const {
            error: updateError
        } = await supabase

            .from("deposit_requests")

            .update({

                utr: utr,

                updated_at:
                    new Date().toISOString()

            })

            .eq(
                "id",
                request.id
            );


        if (updateError) {

            console.error(
                "UTR update error:",
                updateError
            );

            throw new Error(
                updateError.message
            );

        }


        // ===============================
        // SUCCESS
        // ===============================

        message.innerHTML = `
            <div class="success">
                UTR successfully submit ho gaya.
                <br>
                Payment verification ke liye pending hai.
            </div>
        `;


        submitBtn.textContent =
            "Submitted";


    }

    catch (error) {

        console.error(
            "Submit UTR ERROR:",
            error
        );


        message.innerHTML = `
            <div class="error">
                ${escapeHtml(error.message)}
            </div>
        `;


        submitBtn.disabled =
            false;

        submitBtn.textContent =
            "Submit Payment";

    }

}


// ===============================
// HTML ESCAPE
// ===============================

function escapeHtml(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>

</html>
