<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Make Payment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fff7e6,#ffe0b2);
  min-height:100vh;
  padding:20px 12px;
}

.container{
  width:100%;
  max-width:500px;
  margin:auto;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.title{
  text-align:center;
  font-size:24px;
  font-weight:bold;
  color:#222;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:20px;
}

.amountBox{
  text-align:center;
  background:#fff8e1;
  border:1px solid #ffe082;
  border-radius:12px;
  padding:15px;
  margin-bottom:20px;
}

.amountLabel{
  font-size:13px;
  color:#777;
}

.amount{
  font-size:30px;
  font-weight:bold;
  color:#e65100;
  margin-top:5px;
}

.qrBox{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
  min-height:270px;
}

#qrcode{
  width:240px;
  height:240px;
  display:flex;
  justify-content:center;
  align-items:center;
}

#qrcode img{
  width:240px;
  height:240px;
  display:block;
}

.upiBox{
  background:#f5f5f5;
  border-radius:10px;
  padding:13px;
  text-align:center;
  margin-bottom:20px;
}

.upiLabel{
  font-size:13px;
  color:#777;
  margin-bottom:5px;
}

.upiId{
  font-size:17px;
  font-weight:bold;
  word-break:break-all;
}

.instruction{
  text-align:center;
  color:#555;
  font-size:14px;
  line-height:1.5;
  margin-bottom:20px;
}

.label{
  font-size:15px;
  font-weight:bold;
  color:#444;
  margin-bottom:8px;
}

.utrInput{
  width:100%;
  height:52px;
  border:1px solid #ddd;
  border-radius:10px;
  padding:0 14px;
  font-size:17px;
  outline:none;
}

.utrInput:focus{
  border-color:#ff9800;
}

.submitBtn{
  width:100%;
  height:52px;
  margin-top:15px;
  border:0;
  border-radius:11px;
  background:#ff9800;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.submitBtn:disabled{
  background:#aaa;
}

.errorBox{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  background:#ffebee;
  color:#c62828;
  font-size:14px;
  line-height:1.5;
}

.loading{
  text-align:center;
  padding:30px;
  color:#777;
}

</style>

</head>


<body>

<div class="container">

  <div class="card">

    <div class="title">
      Complete Payment
    </div>

    <div class="subtitle">
      Scan QR Code and make payment
    </div>


    <div id="loading" class="loading">
      Loading...
    </div>


    <div id="paymentContent" style="display:none;">

      <div class="amountBox">

        <div class="amountLabel">
          Pay Amount
        </div>

        <div id="amount" class="amount">
          ₹0
        </div>

      </div>


      <div class="qrBox">

        <div id="qrcode"></div>

      </div>


      <div class="upiBox">

        <div class="upiLabel">
          Payment UPI ID
        </div>

        <div class="upiId">
          7KW0568000@mairtel
        </div>

      </div>


      <div class="instruction">

        QR scan karke payment karein.
        <br>
        Payment ke baad User ID niche enter karein.

      </div>


      <div class="label">
        Enter User ID
      </div>


      <input
        id="utr"
        class="utrInput"
        type="text"
        autocomplete="off"
        placeholder="Enter User ID"
      >


      <button
        id="submitBtn"
        class="submitBtn"
        type="button"
        onclick="submitUTR()">

        Submit User ID

      </button>


      <div id="errorBox" class="errorBox"></div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://glhomrlwnwhevunfubog.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VihOz3hSXZzUiI9eANDL0A_EtaD-KIB";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const userId =
localStorage.getItem("user_id");


const UPI_ID =
"7KW0568000@mairtel";


const params =
new URLSearchParams(
  window.location.search
);


const amountFromPage =
Number(
  params.get("amount")
);


let currentRequest = null;


function showError(message){

  const box =
  document.getElementById("errorBox");

  box.innerText =
  message;

  box.style.display =
  "block";

}


function hideError(){

  const box =
  document.getElementById("errorBox");

  box.innerText =
  "";

  box.style.display =
  "none";

}


function hideLoading(){

  document.getElementById(
    "loading"
  ).style.display =
  "none";

}


function showPayment(){

  document.getElementById(
    "paymentContent"
  ).style.display =
  "block";

}


/*
==================================================
CREATE QR
==================================================
*/

function createQR(amount){

  const qrBox =
  document.getElementById("qrcode");

  if(!qrBox){

    throw new Error(
      "QR container nahi mila."
    );

  }


  const upiData =
    "upi://pay" +
    "?pa=" +
    encodeURIComponent(UPI_ID) +
    "&am=" +
    encodeURIComponent(
      Number(amount).toFixed(2)
    ) +
    "&cu=INR";


  console.log(
    "UPI DATA:",
    upiData
  );


  /*
   * QRCode.js ki jagah direct QR image.
   */

  const qrURL =
    "https://api.qrserver.com/v1/create-qr-code/" +
    "?size=240x240" +
    "&data=" +
    encodeURIComponent(upiData);


  qrBox.innerHTML = "";


  const img =
    document.createElement("img");


  img.src =
    qrURL;


  img.width =
    240;


  img.height =
    240;


  img.alt =
    "Payment QR Code";


  img.onload =
  function(){

    console.log(
      "QR successfully loaded"
    );

  };


  img.onerror =
  function(){

    showError(
      "QR image load nahi ho saki. Internet connection check karein."
    );

  };


  qrBox.appendChild(img);

}


/*
==================================================
LOAD REQUEST
==================================================
*/

async function loadRequest(){

  try{

    hideError();


    if(!userId){

      throw new Error(
        "User login nahi mila. Please login again."
      );

    }


    if(
      !amountFromPage ||
      amountFromPage <= 0
    ){

      throw new Error(
        "Amount nahi mila."
      );

    }


    const fiveMinutesAgo =
      new Date(
        Date.now() - 5 * 60 * 1000
      ).toISOString();


    /*
     * Existing pending request check
     */

    const {
      data: existingRequest,
      error: existingError
    } = await supabaseClient

      .from("deposit_requests")

      .select(
        "id,user_id,amount,status,utr,created_at,updated_at"
      )

      .eq(
        "user_id",
        userId
      )

      .eq(
        "amount",
        amountFromPage
      )

      .eq(
        "status",
        "pending"
      )

      .gte(
        "created_at",
        fiveMinutesAgo
      )

      .order(
        "created_at",
        {
          ascending:false
        }
      )

      .limit(1);


    if(existingError){

      console.error(
        "CHECK ERROR:",
        existingError
      );

      throw new Error(
        "Request check nahi ho saki: " +
        existingError.message
      );

    }


    if(
      existingRequest &&
      existingRequest.length > 0
    ){

      currentRequest =
        existingRequest[0];

      console.log(
        "Existing request:",
        currentRequest
      );

    }

    else{

      /*
       * New request
       */

      const {
        data,
        error
      } = await supabaseClient

        .from("deposit_requests")

        .insert({

          user_id:userId,

          amount:amountFromPage,

          status:"pending"

        })

        .select(
          "id,user_id,amount,status,utr,created_at,updated_at"
        )

        .single();


      if(error){

        console.error(
          "INSERT ERROR:",
          error
        );

        throw new Error(
          "Deposit request create nahi hui: " +
          error.message
        );

      }


      if(!data){

        throw new Error(
          "Deposit request create hui lekin data nahi mila."
        );

      }


      currentRequest =
        data;


      console.log(
        "New request:",
        currentRequest
      );

    }


    if(
      !currentRequest ||
      currentRequest.status !== "pending"
    ){

      throw new Error(
        "Deposit request pending nahi hai."
      );

    }


    const amount =
      Number(
        currentRequest.amount
      );


    document.getElementById(
      "amount"
    ).innerText =
      "₹" +
      amount.toFixed(2);


    /*
     * QR generate
     */

    createQR(amount);


    hideLoading();

    showPayment();


  }catch(error){

    console.error(
      "PAYMENT ERROR:",
      error
    );


    hideLoading();


    showError(
      error.message ||
      "Payment page me error aa gaya."
    );

  }

}


/*
==================================================
SUBMIT USER ID
==================================================
*/

async function submitUTR(){

  hideError();


  if(!currentRequest){

    showError(
      "Deposit request nahi mili."
    );

    return;

  }


  const utrInput =
    document.getElementById("utr");


  const submitBtn =
    document.getElementById("submitBtn");


  const utr =
    utrInput.value.trim();


  if(!utr){

    showError(
      "User ID enter karein."
    );

    utrInput.focus();

    return;

  }


  submitBtn.disabled =
  true;

  submitBtn.innerText =
  "Submitting...";


  try{

    const {
      error
    } = await supabaseClient

      .from("deposit_requests")

      .update({

        utr:utr,

        updated_at:
          new Date().toISOString()

      })

      .eq(
        "id",
        currentRequest.id
      )

      .eq(
        "user_id",
        userId
      );


    if(error){

      console.error(
        "UPDATE ERROR:",
        error
      );

      throw new Error(
        "User ID submit nahi hua: " +
        error.message
      );

    }


    window.location.replace(
      "deposit.html"
    );


  }catch(error){

    console.error(error);


    showError(
      error.message ||
      "Submit nahi ho saka."
    );


    submitBtn.disabled =
    false;

    submitBtn.innerText =
    "Submit User ID";

  }

}


/*
==================================================
START
==================================================
*/

loadRequest();

</script>

</body>

</html>
